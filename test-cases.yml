- summary: Регистрация с корректно заполненными полями
  requirement: Пользователь может зарегистрироваться с валидными данными
  prerequisites: Пользователь не зарегистрирован, используется уникальный email
  test-data: |
    nickname: TestUser
    email: unique-user@example.com
    password: Password123
    password_confirmation: Password123
  steps:
    - Открыть страницу регистрации
    - Ввести корректный никнейм
    - Ввести корректный email
    - Ввести пароль длиной не менее 8 символов
    - Повторить пароль
    - Нажать Register
  expected-result: Пользователь перенаправляется на страницу входа. Отображается сообщение «Мы отправили письмо для подтверждения. Подтвердите адрес перед входом».

