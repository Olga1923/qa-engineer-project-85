---
functional:
  - Два игрока должны иметь возможность одновременно решать одну задачу на разных языках программирования.
  - Игроки должны видеть код друг друга, вывод тестов и иметь возможность менять язык программирования во время игры.
  - Пользователь должен иметь возможность играть против другого игрока, бота или друга по специальной ссылке.
  - Пользователь должен иметь возможность выбирать уровень сложности и конкретную задачу для игры.
  - Задачи должны быть доступны на русском и английском языках.
  - Пользователи должны иметь возможность наблюдать за ходом чужих игр.
  - Зарегистрированные пользователи должны иметь возможность общаться в игровом чате.
  - После завершения игры должна быть доступна её запись с возможностью просмотра процесса написания кода.
  - Система должна начислять пользователям очки и формировать рейтинги за неделю, месяц и всё время.

non-functional:
  - Сайт должен быть удобным и понятным для пользователей.
  - Сайт должен обеспечивать высокую скорость работы и быстрое обновление данных во время игры.
  - Сайт должен быть безопасным и защищать данные пользователей.
  - Сайт должен корректно работать на мобильных устройствах.
  - Сайт должен поддерживать последние версии популярных браузеров.
  - Сайт должен выдерживать высокую нагрузку, например 1000 одновременных пользователей.

implicit:
  - Для участия в игре пользователь должен иметь возможность подключиться к ней и взаимодействовать с другим игроком в режиме реального времени.
  - Система должна проверять решения игроков с помощью тестов и определять победителя.
  - Система должна сохранять результаты завершённых игр для последующего просмотра.
  - Рейтинг должен рассчитываться на основании набранных пользователями очков.
  - Система должна предотвращать потерю введённого кода при временных проблемах с соединением, насколько это технически возможно.
  - Система должна обеспечивать корректную работу игрового процесса при одновременных действиях обоих игроков.
